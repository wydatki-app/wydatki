<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--CSP-->
<!-- kontrola:csp-z-builda — build.py wstawia tu CSP z hashami skryptów; test_csp sprawdza blokadę -->
<title>Wydatki</title>
<style>
/*STYL*/
</style>
<script>/*MOTYW*/</script>
</head>
<body>
<main id="start" class="start">
  <div class="jezyk" role="group" data-i18n-aria-label="start.jezyk">
    <button type="button" data-jezyk="pl">PL</button><button type="button" data-jezyk="en">EN</button>
  </div>
  <h1>Wydatki</h1>
  <p class="lead" data-i18n-h="start.lead"></p>

  <div id="strefa" class="strefa">
    <div class="akcje">
      <button id="btn-ostatni" class="btn pri" type="button" hidden></button>
      <button id="btn-folder" class="btn pri" type="button" data-i18n="start.folder"></button>
      <input id="wybierz-folder" type="file" webkitdirectory multiple hidden>
      <label class="btn"><span data-i18n="start.pliki"></span><input id="wybierz-pliki" type="file" accept=".csv,.pdf,.xlsx,.ofx,.qfx,.yaml,.yml,.json" multiple hidden></label>
      <button id="pokaz-demo" class="btn" type="button" data-i18n="start.demo"></button>
    </div>
    <div class="muted" data-i18n="start.przeciagnij"></div>
    <div class="muted" id="info-zapis"></div>
    <div class="muted" id="wyczysc-box" hidden><button id="btn-wyczysc" class="lnk" type="button" data-i18n="start.wyczysc"></button>
      <span data-i18n="start.wyczysc_info"></span></div>
    <div id="start-blad" class="blad" role="alert"></div>
  </div>

  <details>
    <summary data-i18n="start.jak_folder"></summary>
    <pre data-i18n="start.drzewo"></pre>
    <p class="muted" data-i18n-h="start.rozpoznanie"></p>
  </details>
  <details>
    <summary data-i18n="start.pewnosc"></summary>
    <ul>
      <li data-i18n-h="start.pewnosc1"></li>
      <li data-i18n="start.pewnosc2"></li>
      <li data-i18n="start.pewnosc3"></li>
      <li data-i18n="start.pewnosc4"></li>
    </ul>
  </details>
</main>
<div id="app" hidden></div>
<template id="uklad">
<!--UKLAD-->
</template>
<script>
/*SKRYPT*/
</script>
</body>
</html>
