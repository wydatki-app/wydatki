<header class="top"><div class="top-in">
  <div class="brand">Wydatki <small><span data-i18n="ukl.wczytano"></span> <span id="gen"></span></small></div>
  <div class="per">
    <button class="iconbtn" id="per-prev" data-i18n-title="ukl.poprz">‹</button>
    <select id="tabs" data-i18n-aria-label="ukl.okres"></select>
    <button class="iconbtn" id="per-next" data-i18n-title="ukl.nast">›</button>
    <button id="btn-przelicz" class="tab" style="display:none" data-i18n="ukl.przelicz"></button>
    <button class="iconbtn" id="theme-btn" type="button" data-i18n-aria-label="ukl.motyw">◐</button>
  </div>
  <nav class="nav" id="nav">
    <button data-v="przeglad" data-i18n="nav.przeglad"></button>
    <button data-v="transakcje" data-i18n="nav.transakcje"></button>
    <button data-v="budzety" data-i18n="nav.budzety"></button>
    <button data-v="trendy" data-i18n="nav.trendy"></button>
    <button data-v="tagi" data-i18n="nav.tagi"></button>
    <button data-v="ustawienia" data-i18n="nav.ustawienia"></button>
  </nav>
</div></header>
<main class="wrap">

<section class="view" data-view="przeglad">
  <div class="kpis" id="kpis"></div>
  <div class="grid">
    <div class="card"><h2><span data-i18n="fire.tytul"></span> <span class="tag" id="fire-scope"></span></h2>
      <p class="desc" data-i18n="fire.opis"></p>
      <div id="fire"></div></div>
    <div class="card"><h2><span data-i18n="pace.tytul"></span> <span class="tag" id="pace-scope"></span></h2>
      <p class="desc" data-i18n="pace.opis"></p>
      <div id="pace"></div></div>
  </div>
  <div class="card"><h2><span data-i18n="zr.tytul"></span> <span class="tag" id="zr-scope"></span></h2>
    <p class="desc" data-i18n="zr.opis"></p>
    <div class="legend" id="zrodla"></div></div>
  <div class="card"><h2><span data-i18n="kat.tytul"></span> <span class="tag" id="cat-hint"></span></h2>
    <p class="desc" data-i18n="kat.opis"></p>
    <div class="donut-wrap"><div id="donut"></div><div class="legend" id="legend"></div></div>
    <div id="drill"></div>
  </div>
  <div class="card"><h2><span data-i18n="top.tytul"></span> <span class="tag" id="top-scope"></span></h2>
    <p class="desc" data-i18n="top.opis"></p>
    <div id="top"></div></div>
</section>

<section class="view" data-view="transakcje">
  <div class="card"><h2><span data-i18n="tx.tytul"></span> <span class="tag" id="tx-sum"></span></h2>
    <p class="desc" data-i18n="tx.opis"></p>
    <div class="filters">
      <input type="search" id="tx-q" data-i18n-placeholder="tx.szukaj">
      <select id="tx-cat"></select><select id="tx-tag"></select><select id="tx-zr"></select>
      <select id="tx-sort"><option value="d" data-i18n="tx.najnowsze"></option><option value="k" data-i18n="tx.najwieksze"></option></select>
    </div>
    <div id="txlist"></div></div>
  <div class="card" id="refunds-card" style="display:none">
    <h2><span data-i18n="zw.tytul"></span> <span class="tag" id="refunds-sum"></span></h2>
    <p class="desc" data-i18n="zw.opis"></p><div id="refunds"></div></div>
</section>

<section class="view" data-view="budzety">
  <div class="card"><h2><span data-i18n="bud.tytul"></span> <span class="tag" id="bud-scope"></span></h2>
    <p class="desc" data-i18n="bud.opis"></p>
    <div id="budzety"></div></div>
</section>

<section class="view" data-view="trendy">
  <div class="card"><h2 data-i18n="tr.miesiace"></h2>
    <p class="desc" data-i18n="tr.miesiace_opis"></p>
    <div id="months-chart"></div></div>
  <div class="card"><h2><span data-i18n="tr.porownanie"></span> <span class="tag" data-i18n="tr.per_kat"></span></h2><div id="compare"></div></div>
  <div class="grid">
    <div class="card"><h2><span data-i18n="tr.tygodnie"></span> <span class="tag" id="weeks-scope"></span></h2><div id="weeks"></div></div>
    <div class="card"><h2><span data-i18n="tr.subs"></span> <span class="tag" id="subs-sum"></span></h2><div id="subs"></div></div>
  </div>
  <div class="card"><h2><span data-i18n="tr.wplywy"></span> <span class="tag" id="wpl-sum"></span></h2><div id="wplywy"></div></div>
</section>

<section class="view" data-view="tagi">
  <div class="card"><h2 data-i18n="tg.tytul"></h2>
    <p class="desc" data-i18n="tg.opis"></p><div id="tagi"></div></div>
</section>

<section class="view" data-view="ustawienia">
  <div class="card"><h2 data-i18n="ust.reguly"></h2><div id="reguly"></div></div>
  <div class="card"><h2 data-i18n="ust.kategorie"></h2><div id="kategorie"></div></div>
  <div class="card"><h2 data-i18n="ust.fire"></h2><div id="ustawienia-fire"></div></div>
  <div class="card"><h2 data-i18n="ust.zrodla"></h2><div id="ustawienia-zrodla"></div></div>
</section>

<div class="foot" data-i18n="ukl.stopka"></div>
</main>
<div class="tip" id="tip"></div>
