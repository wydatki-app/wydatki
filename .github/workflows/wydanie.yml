# Tag vX.Y.Z → budowanie z kodu w repozytorium → testy → wydanie (plik + SHA-256) → strona demo.
# Plik w wydaniu powstaje tutaj, nie na komputerze autora — każdy może sprawdzić, z jakiego kodu.
name: Wydanie
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  zbuduj:
    runs-on: ubuntu-24.04
    permissions:
      contents: write          # utworzenie wydania
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0             # tagi potrzebne testowi dokumentacji (wersja w stopce ≥ ostatni tag)
      - name: Budowanie
        run: python3 -I build.py
      - name: Test prywatności (CSP bez sieci, brak API sieciowych, brak wyciągów w repo)
        run: python3 -I testy/test_prywatnosc.py
      - name: Test dokumentacji (banki i formaty opisane, wersja w stopce)
        run: python3 -I testy/test_dokumentacja.py
      - name: Testy w Chrome
        run: WYDATKI_CHROMIUM="$(command -v google-chrome)" python3 -I testy/test_przegladarka.py --przegladarka chromium
      - name: Wydanie
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/wydatki.html dist/wydatki.html.sha256 \
            --title "Wydatki ${GITHUB_REF_NAME}" --generate-notes \
            --notes "SHA-256: $(cut -d' ' -f1 dist/wydatki.html.sha256)"
      - name: Strona demo
        run: mkdir -p strona && cp dist/wydatki.html strona/index.html && cp dist/wydatki.html strona/wydatki.html && cp docs/*.html strona/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: strona
  strona:
    needs: zbuduj
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
